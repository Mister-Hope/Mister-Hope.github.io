name: Test blog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Test build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.1

      - name: Install dependencies
        run: pnpm ci

      - name: Build Blog
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run build

  linter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.1

      - name: Install dependencies
        run: pnpm ci

      - name: Linter test
        run: pnpm run lint
